name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-please:
    name: Prepare release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - name: Create or update release PR
        id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  package-macos:
    name: Package macOS arm64
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    runs-on: macos-15
    permissions:
      contents: write
    env:
      TAG_NAME: ${{ needs.release-please.outputs.tag_name }}
    steps:
      - name: Checkout release tag
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: 11.22.0

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - name: Verify release version
        run: |
          node --input-type=module -e '
            import { readFileSync } from "node:fs";
            const { version } = JSON.parse(readFileSync("package.json", "utf8"));
            const expectedTag = `oh-my-bug-v${version}`;
            if (process.env.TAG_NAME !== expectedTag) {
              throw new Error(`RELEASE_TAG_VERSION_MISMATCH:${process.env.TAG_NAME}:${expectedTag}`);
            }
          '

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Electron binary
        run: pnpm exec install-electron

      - name: Install Playwright Chromium
        run: pnpm exec playwright install chromium

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Test
        run: pnpm test

      - name: Make unsigned desktop artifacts
        run: pnpm make

      - name: Verify packaged runtime
        run: |
          apps=()
          while IFS= read -r -d '' candidate; do
            apps+=("$candidate")
          done < <(find out -maxdepth 2 -type d -path '*-darwin-arm64/*.app' -print0)
          test "${#apps[@]}" -eq 1
          app="${apps[0]}"
          pnpm doctor:package -- "--app=$app"

      - name: Run packaged Electron release smoke tests
        run: pnpm test:e2e:electron:release

      - name: Upload release artifacts
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          dmgs=()
          while IFS= read -r -d '' artifact; do
            dmgs+=("$artifact")
          done < <(find out/make -type f -name "*.dmg" -print0)

          zips=()
          while IFS= read -r -d '' artifact; do
            zips+=("$artifact")
          done < <(find out/make -type f -name "*.zip" -print0)

          if [[ ${#dmgs[@]} -lt 1 || ${#zips[@]} -lt 1 ]]; then
            echo "Expected DMG and ZIP artifacts under out/make" >&2
            exit 1
          fi

          release_dir="$RUNNER_TEMP/release-assets"
          mkdir -p "$release_dir"
          for artifact in "${dmgs[@]}" "${zips[@]}"; do
            cp "$artifact" "$release_dir/$(basename "$artifact")"
          done

          cd "$release_dir"
          shasum -a 256 *.dmg *.zip > SHA256SUMS.txt
          gh release upload "$TAG_NAME" ./*.dmg ./*.zip ./SHA256SUMS.txt --clobber --repo "$GITHUB_REPOSITORY"
